<!doctype html>
<html lang="de" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeutschMaster AI - Local Ollama Qwen2.5 Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0fdf4",
                100: "#dcfce7",
                500: "#22c55e",
                600: "#16a34a",
                700: "#15803d",
              },
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body
    class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 flex flex-col"
  >
    <!-- Header -->
    <header
      class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-green-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20"
          >
            <i class="fa-solid fa-graduation-cap text-lg"></i>
          </div>
          <div>
            <h1
              class="font-bold text-lg leading-tight bg-gradient-to-r from-green-600 to-emerald-500 bg-clip-text text-transparent"
            >
              DeutschMaster AI
            </h1>
            <p id="model-label" class="text-xs text-slate-500 dark:text-slate-400">
              Ollama model
            </p>
          </div>
        </div>

        <nav class="hidden md:flex space-x-1">
          <button
            type="button"
            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400"
          >
            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Generator
          </button>
        </nav>

        <div class="flex items-center space-x-3">
          <div class="hidden md:block">
            <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400">
              <i class="fa-solid fa-server text-green-500"></i>
              <span>Endpoint</span>
            </div>
          </div>
        </div>
      </div>
      <div
        class="md:hidden flex border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800"
      >
        <button
          type="button"
          class="flex-1 py-3 text-center text-xs font-medium text-green-600 dark:text-green-400 border-b-2 border-green-600"
        >
          Generator
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main
      class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 overflow-y-auto"
    >
      <!-- TAB 1: GENERATOR VIEW -->
      <section id="view-generator" class="space-y-8">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-4 sm:p-5 border border-slate-200/80 dark:border-slate-700 shadow-sm">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="ollama-endpoint-input"
                class="block text-xs font-semibold mb-1 text-slate-700 dark:text-slate-300"
                >Ollama Endpoint URL</label
              >
              <input
                type="text"
                id="ollama-endpoint-input"
                value="http://localhost:11434"
                class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-500 focus:outline-none"
              />
            </div>
            <div>
              <label
                for="ollama-model-input"
                class="block text-xs font-semibold mb-1 text-slate-700 dark:text-slate-300"
                >Model Name</label
              >
              <select
                id="ollama-model-input"
                class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2.5 text-sm focus:ring-2 focus:ring-green-500 focus:outline-none"
              ></select>
            </div>
          </div>
        </div>

        <div
          class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-6"
        >
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
              <label
                for="cefr-level"
                class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300"
                >CEFR Proficiency Level</label
              >
              <select
                id="cefr-level"
                onchange="persistGeneratorSettings()"
                class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-sm focus:ring-2 focus:ring-green-500 focus:outline-none"
              >
                <option value="A1">A1 - Beginner (Breakthrough)</option>
                <option value="A2">A2 - Elementary (Waystage)</option>
                <option value="B1" selected>
                  B1 - Intermediate (Threshold)
                </option>
                <option value="B2">B2 - Upper Intermediate (Vantage)</option>
                <option value="C1">
                  C1 - Advanced (Effective Operational)
                </option>
                <option value="C2">C2 - Mastery (Proficiency)</option>
              </select>
            </div>

            <div>
              <label
                for="topic-input"
                class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300"
                >Topic / Scenario & Extra Wants</label
              >
              <input
                type="text"
                id="topic-input"
                placeholder="e.g., Ordering food in Berlin; short phrases, 8–12 words, beginner-friendly"
                value="Ordering food in a traditional restaurant"
                oninput="persistGeneratorSettings()"
                class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-4 py-3 text-sm focus:ring-2 focus:ring-green-500 focus:outline-none"
              />
            </div>

            <div>
              <label
                for="sentence-count"
                class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300"
                >Number of Sentences:
                <span id="count-val" class="text-green-600 font-bold"
                  >4</span
                ></label
              >
              <input
                type="range"
                id="sentence-count"
                min="1"
                max="8"
                value="4"
                oninput="document.getElementById('count-val').innerText = this.value; persistGeneratorSettings();"
                class="w-full accent-green-600 mt-3"
              />
            </div>
          </div>

          <div>
            <details class="group">
              <summary
                class="cursor-pointer text-xs font-semibold text-green-600 dark:text-green-400 inline-flex items-center space-x-1 hover:underline"
              >
                <i class="fa-solid fa-sliders mr-1"></i>Advanced Custom Prompt
                Editor
              </summary>
              <div class="mt-3">
                <textarea
                  id="custom-prompt-override"
                  rows="3"
                  class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 p-3 text-xs font-mono focus:ring-2 focus:ring-green-500 focus:outline-none"
                  placeholder="Leave blank to use default structured prompt generator..."
                ></textarea>
              </div>
            </details>
          </div>

          <div class="flex justify-end pt-2">
            <button
              type="button"
              onclick="generateSentences()"
              id="generate-btn"
              class="px-5 py-2.5 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-green-600/20 transition-all flex items-center space-x-2 text-sm"
            >
              <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
              <span>Generate</span>
            </button>
          </div>
        </div>

        <!-- Loading Spinner Container -->
        <div id="loading-container" class="hidden py-16 text-center space-y-4">
          <div
            class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mx-auto"
          ></div>
          <p id="loading-text" class="text-sm text-slate-500 font-medium animate-pulse">
            Generating German sentences...
          </p>
        </div>

        <!-- Results Output Container -->
        <div id="results-container" class="space-y-6"></div>
      </section>

    </main>

    <!-- Toast Notification Container -->
    <div
      id="toast-container"
      class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"
    ></div>

    <!-- Application Logic for Local Ollama -->
    <script>
      // State Management
      window.savedSentences = JSON.parse(
        localStorage.getItem("deutsch_saved_ollama") || "[]"
      );
      window.currentGeneratedSentences = [];

      function loadStoredGeneratorSettings() {
        const savedTopic = localStorage.getItem("deutsch_generator_topic");
        const savedCount = localStorage.getItem("deutsch_generator_count");
        const savedLevel = localStorage.getItem("deutsch_generator_level");

        if (savedTopic) {
          document.getElementById("topic-input").value = savedTopic;
        }

        if (savedCount) {
          document.getElementById("sentence-count").value = savedCount;
          document.getElementById("count-val").innerText = savedCount;
        }

        if (savedLevel) {
          document.getElementById("cefr-level").value = savedLevel;
        }
      }

      function persistGeneratorSettings() {
        localStorage.setItem(
          "deutsch_generator_topic",
          document.getElementById("topic-input").value.trim()
        );
        localStorage.setItem(
          "deutsch_generator_count",
          document.getElementById("sentence-count").value
        );
        localStorage.setItem(
          "deutsch_generator_level",
          document.getElementById("cefr-level").value
        );
      }

      window.addEventListener("DOMContentLoaded", () => {
        checkOllamaStatus();
        loadStoredGeneratorSettings();
      });

      async function loadInstalledOllamaModels() {
        const select = document.getElementById("ollama-model-input");
        const endpoint =
          localStorage.getItem("ollama_endpoint") || "http://localhost:11434";
        const fallbackModel = localStorage.getItem("ollama_model") || "qwen2.5:14b";

        try {
          const response = await fetch(`${endpoint.replace(/\/$/, "")}/api/tags`);
          if (!response.ok) throw new Error("Failed to fetch models");
          const data = await response.json();
          const models = (data.models || []).map((m) => m.name).filter(Boolean);

          select.innerHTML = "";

          if (models.length === 0) {
            const option = document.createElement("option");
            option.value = fallbackModel;
            option.textContent = fallbackModel;
            select.appendChild(option);
          } else {
            models.forEach((modelName) => {
              const option = document.createElement("option");
              option.value = modelName;
              option.textContent = modelName;
              select.appendChild(option);
            });
          }

          const savedModel = localStorage.getItem("ollama_model") || models[0] || fallbackModel;
          select.value = models.includes(savedModel) ? savedModel : (models[0] || fallbackModel);
        } catch (error) {
          console.error("Unable to load Ollama models:", error);
          const option = document.createElement("option");
          option.value = fallbackModel;
          option.textContent = fallbackModel;
          select.appendChild(option);
          select.value = fallbackModel;
        }
      }

      function updateModelLabel() {
        const select = document.getElementById("ollama-model-input");
        const label = document.getElementById("model-label");
        const model = select && select.value ? select.value : localStorage.getItem("ollama_model") || "qwen2.5:14b";
        label.textContent = `Ollama ${model} Studio`;
        const loadingText = document.getElementById("loading-text");
        if (loadingText) {
          loadingText.textContent = `Generating German sentences with ${model}...`;
        }
      }

      window.checkOllamaStatus = async function () {
        const endpoint =
          localStorage.getItem("ollama_endpoint") || "http://localhost:11434";
        const model = localStorage.getItem("ollama_model") || "qwen2.5:14b";
        document.getElementById("ollama-endpoint-input").value = endpoint;
        await loadInstalledOllamaModels();
        const select = document.getElementById("ollama-model-input");
        const savedModel = localStorage.getItem("ollama_model") || model;
        const validOptions = Array.from(select.options).map((option) => option.value);
        select.value = validOptions.includes(savedModel) ? savedModel : (validOptions[0] || model);
        updateModelLabel();
      };

      document.getElementById("ollama-model-input").addEventListener("change", function () {
        localStorage.setItem("ollama_model", this.value);
        updateModelLabel();
      });

      function saveOllamaSettings() {
        const endpoint = document
          .getElementById("ollama-endpoint-input")
          .value.trim();
        const model = document.getElementById("ollama-model-input").value.trim();
        if (!endpoint || !model) {
          showToast("Please fill in both endpoint and model name.", "error");
          return;
        }
        localStorage.setItem("ollama_endpoint", endpoint);
        localStorage.setItem("ollama_model", model);
        updateModelLabel();
        showToast("Ollama settings saved successfully!");
      }

      document.getElementById("ollama-endpoint-input").addEventListener("change", saveOllamaSettings);

      // Helper function to safely extract sentence arrays from nested JSON responses.
      // Only accept arrays that look like sentence objects so we don't accidentally
      // return metadata arrays such as tags, keywords, or other wrapper fields.
      function extractSentenceArray(parsed) {
        const isSentenceLike = (item) =>
          item &&
          typeof item === "object" &&
          ("german" in item || "english" in item || "grammarTip" in item || "level" in item);

        if (Array.isArray(parsed)) {
          return parsed.filter(isSentenceLike);
        }

        if (typeof parsed === "object" && parsed !== null) {
          const preferredKeys = [
            "sentences",
            "items",
            "results",
            "data",
            "response",
            "output",
          ];

          for (const key of preferredKeys) {
            const value = parsed[key];
            if (Array.isArray(value)) {
              const filtered = value.filter(isSentenceLike);
              if (filtered.length > 0) return filtered;
            }
          }

          for (const key in parsed) {
            if (!Object.prototype.hasOwnProperty.call(parsed, key)) continue;
            const value = parsed[key];
            if (Array.isArray(value)) {
              const filtered = value.filter(isSentenceLike);
              if (filtered.length > 0) return filtered;
            }
          }
        }

        return [];
      }

      // Generate Sentences via Local Ollama API (/api/chat)
      window.generateSentences = async function () {
        const endpoint =
          localStorage.getItem("ollama_endpoint") || "http://localhost:11434";
        const model = localStorage.getItem("ollama_model") || "qwen2.5:14b";

        const level = document.getElementById("cefr-level").value;
        const topic = document.getElementById("topic-input").value;
        const count = document.getElementById("sentence-count").value;
        const customPrompt = document
          .getElementById("custom-prompt-override")
          .value.trim();

        const jsonSchemaHint = `
Respond strictly with a valid JSON object in this exact format, with no markdown formatting or extra text outside the JSON:
{
  "sentences": [
    {
      "german": "Sentence in German",
      "english": "Sentence in English",
      "level": "${level}",
      "topic": "${topic}",
      "vocabulary": [
        { "word": "word", "translation": "translation", "partOfSpeech": "noun/verb/adj" }
      ]
    }
  ]
}`.trim();

        const promptText =
          customPrompt ||
          `Generate exactly ${count} German sentences suitable for CEFR level ${level} about the topic: "${topic}". ${jsonSchemaHint}`;

        const systemPrompt =
          "You are an expert German language teacher. Output ONLY valid JSON matching the requested schema. Do not include markdown code blocks or conversational filler.";

        document.getElementById("loading-container").classList.remove("hidden");
        document.getElementById("results-container").innerHTML = "";
        document.getElementById("generate-btn").disabled = true;

        try {
          const response = await fetch(`${endpoint.replace(/\/$/, "")}/api/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: model,
              messages: [
                { role: "system", content: systemPrompt },
                { role: "user", content: promptText },
              ],
              format: "json",
              stream: false,
            }),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();
          const content = data.message?.content;

          if (content) {
            let cleaned = content.trim();
            if (cleaned.startsWith("```json")) cleaned = cleaned.replace(/^```json/, "");
            if (cleaned.startsWith("```")) cleaned = cleaned.replace(/^```/, "");
            if (cleaned.endsWith("```")) cleaned = cleaned.slice(0, -3);

            const parsed = JSON.parse(cleaned.trim());
            const items = extractSentenceArray(parsed);

            if (items.length > 0) {
              window.currentGeneratedSentences = items;
              renderSentences(
                window.currentGeneratedSentences,
                "results-container"
              );
              showToast("Sentences generated successfully!");
            } else {
              showToast("Model returned an invalid format. Trying again...", "error");
            }
          } else {
            throw new Error("Empty response received from Ollama.");
          }
        } catch (error) {
          console.error(error);
          showToast(
            "Failed to parse model output or connect to Ollama.",
            "error"
          );
        } finally {
          document.getElementById("loading-container").classList.add("hidden");
          document.getElementById("generate-btn").disabled = false;
        }
      };

      document.documentElement.classList.add("dark");

      // Presets
      window.applyPreset = function (type) {
        const topicInput = document.getElementById("topic-input");
        const levelSelect = document.getElementById("cefr-level");
        if (type === "travel") {
          topicInput.value =
            "Navigating airports, train stations, and asking for directions";
          levelSelect.value = "A2";
        } else if (type === "business") {
          topicInput.value =
            "Professional meeting negotiations, emails, and phone calls";
          levelSelect.value = "B2";
        } else if (type === "romance") {
          topicInput.value =
            "Casual chatting at a cafe, hobbies, and making friends";
          levelSelect.value = "A1";
        } else if (type === "grammar") {
          topicInput.value =
            "Complex subjunctive II (Konjunktiv II) and passive voice clauses";
          levelSelect.value = "C1";
        }
        showToast("Preset loaded successfully!");
      };

      // Toast Notification
      window.showToast = function (message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `pointer-events-auto px-4 py-3 rounded-2xl text-xs font-semibold shadow-lg text-white transition-all transform translate-y-2 opacity-0 flex items-center space-x-2 ${
          type === "success"
            ? "bg-slate-900 dark:bg-slate-700 border border-slate-700"
            : "bg-red-600"
        }`;
        toast.innerHTML = `<i class="fa-solid ${
          type === "success" ? "fa-circle-check text-green-400" : "fa-circle-exclamation"
        }"></i><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(
          () => toast.classList.remove("translate-y-2", "opacity-0"),
          50
        );
        setTimeout(() => {
          toast.classList.add("translate-y-2", "opacity-0");
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      };

      // Render Sentence Cards
      window.renderSentences = function (
        sentences,
        containerId,
        isSavedView = false
      ) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (!sentences || sentences.length === 0) {
          container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">No sentences found. Generate some or save your favorites!</div>`;
          return;
        }

        sentences.forEach((item, index) => {
          const isSaved = window.savedSentences.some(
            (s) => s.german === item.german
          );
          const card = document.createElement("div");
          card.className =
            "bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4";

          let vocabHtml = "";
          if (item.vocabulary && item.vocabulary.length > 0) {
            vocabHtml = `
              <div class="flex flex-wrap gap-2 pt-2">
                ${item.vocabulary
                  .map(
                    (v) => `
                  <span class="px-3 py-1 bg-slate-100 dark:bg-slate-700 rounded-xl text-xs">
                    <strong class="text-green-600 dark:text-green-400">${v.word || ""}</strong> ${
                      v.partOfSpeech ? `(${v.partOfSpeech})` : ""
                    }: ${v.translation || ""}
                  </span>
                `
                  )
                  .join("")}
              </div>
            `;
          }

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div class="space-y-1">
                <span class="px-2.5 py-0.5 rounded-full bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300 text-xs font-bold uppercase">${
                  item.level || "B1"
                }</span>
                <span class="text-xs text-slate-400 ml-2"><i class="fa-solid fa-tag mr-1"></i>${
                  item.topic || "General"
                }</span>
              </div>
            </div>
            <div class="space-y-2">
              <p class="text-xl font-bold text-slate-900 dark:text-white">${
                item.german || ""
              }</p>
              <p class="text-sm text-slate-600 dark:text-slate-300">${
                item.english || ""
              }</p>
            </div>
            ${vocabHtml}
          `;
          container.appendChild(card);
        });
      };

    </script>
  </body>
</html>

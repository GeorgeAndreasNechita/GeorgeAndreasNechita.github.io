<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vocabulary Trainer</title>
    <style>
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --accent-color: #bb86fc;
        --secondary-color: violet;
        --button-bg: #1e1e1e;
        --danger-color: #cf6679;

        /* Level Colors */
        --color-off: #444;
        --color-1x: #4caf50;
        --color-2x: #ffb74d;
        --color-3x: #bb86fc;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow: hidden;
      }

      /* Top Control Bar */
      .top-controls {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
        z-index: 10;
        justify-content: flex-end;
      }

      .top-btn {
        padding: 8px 14px;
        background: #1e1e1e;
        color: #888;
        border: 2px solid var(--color-off);
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: bold;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      /* Dynamic classes for repetitions */
      .state-off {
        border-color: var(--color-off);
        color: #555;
        opacity: 0.6;
      }

      .state-1x {
        border-color: var(--color-1x);
        color: var(--color-1x);
        background: rgba(76, 175, 80, 0.1);
      }

      .state-2x {
        border-color: var(--color-2x);
        color: var(--color-2x);
        background: rgba(255, 183, 77, 0.15);
        box-shadow: 0 0 10px rgba(255, 183, 77, 0.1);
      }

      .state-3x {
        border-color: var(--color-3x);
        color: var(--color-3x);
        background: rgba(187, 134, 252, 0.2);
        box-shadow: 0 0 15px rgba(187, 134, 252, 0.3);
        transform: scale(1.05);
      }

      /* Main Area */
      #display-area {
        height: 50vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        border-bottom: 2px solid #333;
      }
      #content-container {
        margin: 12vh 10px 0;
      }
      .tr-lang1 {
        color: var(--secondary-color);
        font-size: 1.15rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .tr-lang2 {
        font-size: 1.15rem;
        opacity: 0.7;
        margin-bottom: 25px;
      }

      /* OPTIMIZED REPEAT BUTTON */
      .repeat-btn {
        padding: 40px 60px;
        min-width: 200px;
        width: 95%;
        background: rgba(187, 134, 252, 0.05);
        border: 2px solid var(--accent-color);
        color: var(--accent-color);
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.1rem;
        transition: transform 0.1s ease, background 0.2s;
        touch-action: manipulation;
      }

      .repeat-btn:active {
        transform: scale(0.92);
        background: rgba(187, 134, 252, 0.2);
      }

      #button-area {
        height: 50vh;
        width: 100%;
      }

      /* OPTIMIZED NEXT BUTTON */
      .next-btn {
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #1e1e1e, #181818);
        color: var(--accent-color);
        border: none;
        font-size: 4.5rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: background 0.1s, transform 0.1s;
        touch-action: manipulation;
      }

      .next-btn:active {
        background: #252525;
        transform: scale(0.98);
      }

      .next-btn:disabled {
        opacity: 0.3;
        filter: grayscale(1);
      }

      .counter {
        font-size: 1rem;
        color: #666;
        margin-top: 15px;
        letter-spacing: 2px;
      }

      /* Voice picker modal */
      #voice-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        justify-content: center;
        align-items: center;
      }
      #voice-modal-overlay.open {
        display: flex;
      }
      #voice-modal {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        width: 88%;
        max-width: 420px;
        max-height: 75vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #voice-modal-title {
        padding: 16px;
        font-weight: bold;
        color: var(--accent-color);
        border-bottom: 1px solid #333;
      }
      #voice-modal-list {
        overflow-y: auto;
        padding: 8px;
      }
      .voice-option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 14px 12px;
        margin: 4px 0;
        background: #222;
        border: 2px solid #333;
        border-radius: 8px;
        color: var(--text-color);
        font-size: 0.95rem;
        cursor: pointer;
      }
      .voice-option:active {
        background: #2a2a2a;
      }
      .voice-option.current {
        border-color: var(--accent-color);
        color: var(--accent-color);
        background: rgba(187, 134, 252, 0.1);
      }
      .voice-option-lang {
        display: block;
        font-size: 0.75rem;
        opacity: 0.6;
        margin-top: 2px;
      }
      #voice-modal-cancel {
        padding: 14px;
        border-top: 1px solid #333;
        background: none;
        border-left: none;
        border-right: none;
        border-bottom: none;
        color: var(--danger-color);
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="top-controls">
      <button id="lang1-toggle" onclick="cycleLang1()" class="top-btn">DE: --</button>
      <button id="lang2-toggle" onclick="cycleLang2()" class="top-btn">EN: --</button>
      <button onclick="changeIndex()" class="top-btn">Change Index</button>
      <button onclick="showVoices()" class="top-btn">Voices</button>
      <button onclick="pickVoice('de')" class="top-btn">DE Voice</button>
      <button onclick="pickVoice('en')" class="top-btn">EN Voice</button>
    </div>

    <div id="display-area">
      <div id="content-container">Loading...</div>
      <button
        id="repeat-btn-el"
        class="repeat-btn"
        onclick="speakCurrent()"
        style="display: none"
      >
        Repeat ↻
      </button>
    </div>

    <div id="button-area">
      <button class="next-btn" onclick="incrementIndex()" disabled>
        NEXT
        <div id="counter-display" class="counter"></div>
      </button>
    </div>

    <div id="voice-modal-overlay" onclick="if(event.target===this) closeVoiceModal()">
      <div id="voice-modal">
        <div id="voice-modal-title"></div>
        <div id="voice-modal-list"></div>
        <button id="voice-modal-cancel" onclick="closeVoiceModal()">Cancel</button>
      </div>
    </div>

    <script>
      let texts = [];
      let settings = {
        lang1Repeat: parseInt(localStorage.getItem("lang1Repeat") || "1"),
        lang2Repeat: parseInt(localStorage.getItem("lang2Repeat") || "1"),
      };

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      // Helper function to find voices properly on iOS and other browsers
      function getVoice(lang) {
        const voices = window.speechSynthesis.getVoices();
        const shortLang = lang.split('-')[0];

        // If the user has manually picked a voice for this language via the
        // "DE Voice" / "EN Voice" buttons, always use exactly that one -
        // there's no reliable way to read the OS-level default voice
        // through the Web Speech API, so guessing isn't worth it once a
        // manual choice exists.
        const savedURI = localStorage.getItem('voiceURI_' + shortLang);
        if (savedURI) {
          const saved = voices.find(v => v.voiceURI === savedURI);
          if (saved) return saved;
        }

        // Otherwise fall back to a best-effort guess: exact match first
        // (e.g., "de-DE"), else language-prefix match (e.g., "de"),
        // preferring anything that looks higher quality.
        const exactMatches = voices.filter(v => v.lang === lang);
        const prefixMatches = voices.filter(v => v.lang.startsWith(shortLang));
        const candidates = exactMatches.length ? exactMatches : prefixMatches;

        if (!candidates.length) return undefined;

        const isHighQuality = (v) =>
          /enhanced|premium|neural/i.test(v.name) || /enhanced|premium|neural/i.test(v.voiceURI || "");

        return candidates.find(isHighQuality) || candidates[0];
      }

      // Lets the user manually pick which installed voice to use for a
      // given language, since the app has no way to read the OS-level
      // default voice via the Web Speech API. Choice is remembered.
      function pickVoice(shortLang) {
        const voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith(shortLang));
        if (!voices.length) {
          alert(`No ${shortLang.toUpperCase()} voices reported yet. Try again in a second, or reload the page.`);
          return;
        }

        const currentURI = localStorage.getItem('voiceURI_' + shortLang);
        const overlay = document.getElementById('voice-modal-overlay');
        const title = document.getElementById('voice-modal-title');
        const list = document.getElementById('voice-modal-list');

        title.textContent = `Pick a ${shortLang.toUpperCase()} voice`;
        list.innerHTML = '';

        voices.forEach(v => {
          const btn = document.createElement('button');
          btn.className = 'voice-option' + (v.voiceURI === currentURI ? ' current' : '');
          btn.innerHTML = `${v.name}<span class="voice-option-lang">${v.lang}${v.voiceURI === currentURI ? ' · current' : ''}</span>`;
          btn.onclick = () => selectVoice(shortLang, v.voiceURI, v.name);
          list.appendChild(btn);
        });

        overlay.classList.add('open');
      }

      function selectVoice(shortLang, voiceURI, name) {
        localStorage.setItem('voiceURI_' + shortLang, voiceURI);
        closeVoiceModal();
      }

      function closeVoiceModal() {
        document.getElementById('voice-modal-overlay').classList.remove('open');
      }

      // Preload voices for browsers that load them asynchronously (like Safari/Chrome).
      // iOS in particular returns an empty array from getVoices() until the
      // voiceschanged event fires, so we cache the loaded list here and
      // expose a promise other code can await before picking a voice.
      let voicesReadyResolve;
      const voicesReady = new Promise((resolve) => { voicesReadyResolve = resolve; });

      function primeVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length) {
          voicesReadyResolve(voices);
        }
      }
      if (typeof window.speechSynthesis !== 'undefined') {
        primeVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          primeVoices();
        };
      }

      async function loadTexts() {
        try {
          const url = "https://raw.githubusercontent.com/GeorgeAndreasNechita/GeorgeAndreasNechita.github.io/refs/heads/main/texts.json";
          const cacheBuster = `?t=${Date.now()}`;
          const res = await fetch(url + cacheBuster);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          texts = await res.json();
          updateButtonsUI();
          renderData();
        } catch (e) {
          console.error("Error loading JSON:", e);
        }
      }

      function cycleLang1() {
        settings.lang1Repeat = (settings.lang1Repeat + 1) % 4;
        save();
        updateButtonsUI();
      }

      function cycleLang2() {
        settings.lang2Repeat = (settings.lang2Repeat + 1) % 2;
        save();
        updateButtonsUI();
      }

      function save() {
        localStorage.setItem("lang1Repeat", settings.lang1Repeat);
        localStorage.setItem("lang2Repeat", settings.lang2Repeat);
      }

      function updateButtonsUI() {
        const lang1Btn = document.getElementById("lang1-toggle");
        const lang2Btn = document.getElementById("lang2-toggle");

        lang1Btn.innerHTML = `🇩🇪 DE: ${settings.lang1Repeat === 0 ? "OFF" : settings.lang1Repeat + "x"}`;
        lang1Btn.className = "top-btn " + (settings.lang1Repeat === 0 ? "state-off" : "state-" + settings.lang1Repeat + "x");

        lang2Btn.innerHTML = `🇬🇧 EN: ${settings.lang2Repeat === 0 ? "OFF" : "1x"}`;
        lang2Btn.className = "top-btn " + (settings.lang2Repeat === 0 ? "state-off" : "state-1x");
      }

      // --- FIX: build a list of utterances and speak them one at a time,
      // waiting for each one's "end" event before starting the next.
      // Firing multiple speak() calls back-to-back (the old loop) is what
      // caused the distorted/sped-up audio on iOS Safari - Chrome and
      // Android tolerate a stacked queue fine, iOS's speech engine doesn't.
      async function speakCurrent() {
        const item = texts[getCurrentIndex()];
        if (!item) return;
        window.speechSynthesis.cancel();

        // Wait (briefly) for iOS to hand us its real voice list before
        // building utterances - otherwise getVoice() finds nothing and
        // iOS falls back to the default (English) voice for everything.
        await Promise.race([
          voicesReady,
          new Promise((resolve) => setTimeout(resolve, 300)),
        ]);

        const queue = [];
        for (let i = 0; i < settings.lang1Repeat; i++) {
          queue.push({ text: item.lang1, lang: "de-DE" });
        }
        for (let i = 0; i < settings.lang2Repeat; i++) {
          queue.push({ text: item.lang2, lang: "en-US" });
        }

        playQueue(queue, 0);
      }

      function playQueue(queue, index) {
        if (index >= queue.length) return;

        const { text, lang } = queue[index];
        const m = new SpeechSynthesisUtterance(text);
        m.lang = lang;

        // Always set the voice explicitly (including iOS) - relying on
        // .lang alone isn't reliably picking the right system voice.
        const voice = getVoice(lang);
        if (voice) m.voice = voice;

        m.onend = () => playQueue(queue, index + 1);
        m.onerror = () => playQueue(queue, index + 1); // don't get stuck if one utterance fails

        window.speechSynthesis.speak(m);
      }

      function getCurrentIndex() {
        return parseInt(localStorage.getItem("vocabulary_index") || "0");
      }

      function renderData() {
        const idx = getCurrentIndex();
        const container = document.getElementById("content-container");
        const nextBtn = document.querySelector(".next-btn");
        if (idx >= texts.length) {
          container.innerHTML = "End!";
          nextBtn.disabled = true;
          return;
        }

        const item = texts[idx];
        const lang1Text = item.lang1 !== undefined ? item.lang1 : (item.de !== undefined ? item.de : item.it);
        const lang2Text = item.lang2 !== undefined ? item.lang2 : (item.en !== undefined ? item.en : item.it);

        container.innerHTML = `<div class="tr-lang1">${lang1Text}</div><div class="tr-lang2">${lang2Text}</div>`;
        document.getElementById("repeat-btn-el").style.display = "inline-block";
        document.getElementById("counter-display").innerHTML = `${idx + 1} of ${texts.length}`;
        nextBtn.disabled = false;
        speakCurrent();
      }

      function incrementIndex() {
        localStorage.setItem("vocabulary_index", getCurrentIndex() + 1);
        renderData();
      }

      // Debug helper: shows exactly what voices iOS (or any browser) is
      // reporting for German/English, so you can see on-device whether an
      // Enhanced/Premium voice is actually installed, without needing a
      // Mac + Safari remote inspector.
      function showVoices() {
        const voices = window.speechSynthesis.getVoices();
        const relevant = voices.filter(v => v.lang.startsWith("de") || v.lang.startsWith("en"));

        if (!relevant.length) {
          alert("No voices reported yet (list may still be loading). Try again in a second, or reload the page.");
          return;
        }

        const lines = relevant.map(v => {
          const picked = getVoice(v.lang) === v ? " <-- PICKED" : "";
          return `${v.name} | ${v.lang} | ${v.voiceURI}${picked}`;
        });

        alert(`Found ${relevant.length} DE/EN voice(s):\n\n` + lines.join("\n\n"));
      }

      function changeIndex() {
        const val = prompt(`Enter index (1 - ${texts.length}):`, getCurrentIndex() + 1);
        if (val !== null) {
          const newIdx = parseInt(val) - 1;
          if (!isNaN(newIdx) && newIdx >= 0 && newIdx < texts.length) {
            localStorage.setItem("vocabulary_index", newIdx);
            renderData();
          } else {
            alert("Invalid index!");
          }
        }
      }
      loadTexts();
    </script>
  </body>
</html>
